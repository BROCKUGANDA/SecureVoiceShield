name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck / lint
        run: bun run lint

      - name: Data class check
        run: bun run check:data-class

      - name: Port check
        run: bun run check:ports

      - name: Hreflang check
        run: bun run check:hreflang

      - name: Tests
        run: bun test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build
          path: .next/standalone
          retention-days: 7
