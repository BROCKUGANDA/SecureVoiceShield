name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bun run build

      - name: Package standalone
        run: |
          cd .next/standalone
          tar czf ../../deploy-full.tar.gz .
          cd ../..
          ls -lh deploy-full.tar.gz

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy-full.tar.gz
          retention-days: 7

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download deploy bundle
        uses: actions/download-artifact@v4
        with:
          name: deploy-bundle

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy bundle to VPS
        run: |
          scp -i ~/.ssh/deploy_key deploy-full.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/deploy-full.tar.gz

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} <<'REMOTE'
          set -e
          APP_DIR=/opt/securevoiceshield
          sudo mkdir -p "$APP_DIR"
          sudo chown -R ubuntu:ubuntu "$APP_DIR"
          cd "$APP_DIR"
          # ensure node runtime
          if ! command -v node >/dev/null 2>&1; then
            curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
            sudo apt-get install -y nodejs
          fi
          # extract
          rm -rf "$APP_DIR"/*
          tar xzf /tmp/deploy-full.tar.gz -C "$APP_DIR"
          rm -f /tmp/deploy-full.tar.gz
          # systemd unit
          sudo tee /etc/systemd/system/securevoiceshield.service >/dev/null <<EOF
          [Unit]
          Description=SecureVoice Shield (Next.js)
          After=network.target
          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=$APP_DIR
          Environment=NODE_ENV=production
          Environment=PORT=3000
          ExecStart=/usr/bin/node server.js
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl enable --now securevoiceshield.service
          sudo systemctl restart securevoiceshield.service
          sudo systemctl status securevoiceshield.service --no-pager | head -20
          REMOTE