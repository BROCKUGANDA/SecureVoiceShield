# GitLab CI/CD — dev, staging, main with autopromotion
stages:
  - build
  - test
  - promote
  - deploy

variables:
  BUN_VERSION: "1.3.4"

before_script:
  - curl -fsSL https://bun.sh/install | bash
  - export PATH="$HOME/.bun/bin:$PATH"
  - bun install --frozen-lockfile

build:
  stage: build
  script:
    - bun run build
  artifacts:
    paths:
      - .next/standalone
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"

test:
  stage: test
  script:
    - bun run lint
    - bun run check:data-class
    - bun run check:ports
    - bun test
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"

# Auto-promote dev -> staging when CI passes on dev
promote_dev_to_staging:
  stage: promote
  image: alpine:latest
  before_script: []
  script:
    - apk add --no-cache curl jq
    - |
      if [ "$CI_COMMIT_BRANCH" = "dev" ]; then
        echo "Promoting dev -> staging..."
        # Create merge request via GitLab API
        curl -s -X POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" \
          --header "PRIVATE-TOKEN: $GITLAB_PROMOTE_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"source_branch\":\"dev\",\"target_branch\":\"staging\",\"title\":\"Auto-promote: dev -> staging\",\"remove_source_branch\":false}" \
          -o /tmp/mr.json
        cat /tmp/mr.json
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

# Auto-promote staging -> main when CI passes on staging
promote_staging_to_main:
  stage: promote
  image: alpine:latest
  before_script: []
  script:
    - apk add --no-cache curl jq
    - |
      if [ "$CI_COMMIT_BRANCH" = "staging" ]; then
        echo "Promoting staging -> main..."
        curl -s -X POST "$CI_API_V4_URL/projects/$CI_PROJECT_ID/merge_requests" \
          --header "PRIVATE-TOKEN: $GITLAB_PROMOTE_TOKEN" \
          --header "Content-Type: application/json" \
          --data "{\"source_branch\":\"staging\",\"target_branch\":\"main\",\"title\":\"Auto-promote: staging -> main\",\"remove_source_branch\":false}" \
          -o /tmp/mr.json
        cat /tmp/mr.json
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

deploy_dev:
  stage: deploy
  script:
    - bash scripts/deploy.sh
  environment:
    name: development
    url: https://dev.shield.securevoiceai.me
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_staging:
  stage: deploy
  script:
    - bash scripts/deploy.sh
  environment:
    name: staging
    url: https://staging.shield.securevoiceai.me
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

deploy_production:
  stage: deploy
  script:
    - bash scripts/deploy.sh
  environment:
    name: production
    url: https://shield.securevoiceai.me
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual