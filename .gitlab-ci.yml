# GitLab CI/CD — dev, staging, main
stages:
  - build
  - test
  - deploy

variables:
  BUN_VERSION: "1.3.4"

before_script:
  - curl -fsSL https://bun.sh/install | bash
  - export PATH="$HOME/.bun/bin:$PATH"
  - bun install --frozen-lockfile

build:
  stage: build
  script:
    - bun run build
  artifacts:
    paths:
      - .next/standalone
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"

test:
  stage: test
  script:
    - bun run lint
    - bun run check:data-class
    - bun run check:ports
    - bun run check:hreflang
    - bun test
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "staging" || $CI_COMMIT_BRANCH == "main"

deploy_dev:
  stage: deploy
  script:
    - echo "Deploy to dev environment"
    - bash scripts/deploy.sh
  environment:
    name: development
    url: https://dev.shield.securevoiceai.me
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

deploy_staging:
  stage: deploy
  script:
    - echo "Deploy to staging environment"
    - bash scripts/deploy.sh
  environment:
    name: staging
    url: https://staging.shield.securevoiceai.me
  rules:
    - if: $CI_COMMIT_BRANCH == "staging"

deploy_production:
  stage: deploy
  script:
    - echo "Deploy to production"
    - bash scripts/deploy.sh
  environment:
    name: production
    url: https://shield.securevoiceai.me
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual